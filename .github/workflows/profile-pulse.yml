name: Refresh GitHub activity
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update_activity.py
      - .github/workflows/profile-pulse.yml
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check streak calculations
        run: python -m unittest discover -s tests -v
      - name: Generate GitHub contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_activity.py
      - name: Commit updated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-activity.svg
          git add assets/github-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh GitHub contribution activity'
            git push
          fi
